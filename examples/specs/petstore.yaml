openapi: 3.0.3
info:
  title: Petstore (polymorphic)
  version: "2.1"
  description: Petstore-style API exercising allOf, oneOf with a discriminator, and nullable.
servers:
  - url: https://petstore.example.com/v2
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 0, exclusiveMinimum: true, maximum: 100 }
        - name: species
          in: query
          schema: { type: string, enum: [dog, cat, yes, no] }
        - name: X-Request-ID
          in: header
          schema: { type: string, format: uuid }
        - name: Accept
          in: header
          schema: { type: string }
      responses:
        200:
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/NewPet" }
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        201:
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: string }
      - name: session
        in: cookie
        schema: { type: string }
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          description: Overrides the path-level definition.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        200:
          description: The pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        4XX:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePet
      security: []
      responses:
        204:
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
    NewPet:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        birthday: { type: string, format: date, example: 2020-01-01 }
        nickname: { type: string, nullable: true }
        kind:
          oneOf:
            - $ref: "#/components/schemas/Dog"
            - $ref: "#/components/schemas/Cat"
          discriminator:
            propertyName: type
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64, readOnly: true }
    Dog:
      type: object
      required: [type, bark]
      properties:
        type: { type: string, enum: [dog] }
        bark: { type: boolean }
    Cat:
      type: object
      required: [type, lives]
      properties:
        type: { type: string, enum: [cat] }
        lives: { type: integer, minimum: 1, maximum: 9 }
